name: Validate index consistency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
env:
  REGISTRY: ghcr.io

jobs:
  validate_commit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
    name: Validate commit
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Krew
        run: |
          set -x; cd "$(mktemp -d)" &&
          OS="$(uname | tr '[:upper:]' '[:lower:]')" &&
          ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')" &&
          KREW="krew-${OS}_${ARCH}" &&
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${KREW}.tar.gz" &&
          tar zxvf "${KREW}.tar.gz" &&
          ./"${KREW}" install krew

      - name: Validate index consistency
        run: |
          export PATH="${KREW_ROOT:-$HOME/.krew}/bin:$PATH"
          if ! krew_install_output="$(kubectl krew install --manifest=plugins/arcane.yaml 2>&1)"; then
            echo "Raw output (kubectl krew install): $krew_install_output"
            exit 1
          fi
          echo "Raw output (kubectl krew install): $krew_install_output"

          manifest_version_raw="$(awk '$1=="version:" {print $2; exit}' plugins/arcane.yaml)"
          echo "Raw output (manifest version field): $manifest_version_raw"
          manifest_version="${manifest_version_raw#v}"

          if ! arcane_version_output="$(kubectl arcane version 2>&1)"; then
            echo "Raw output (kubectl arcane version): $arcane_version_output"
            exit 1
          fi
          echo "Raw output (kubectl arcane version): $arcane_version_output"
          installed_version="$(echo "$arcane_version_output" | sed -nE 's/.*Version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

          if [ -z "$installed_version" ]; then
            echo "Unable to parse plugin version from output: $arcane_version_output"
            exit 1
          fi

          if [ "$manifest_version" != "$installed_version" ]; then
            echo "Version mismatch: manifest=$manifest_version, installed=$installed_version"
            exit 1
          else
            echo "Version matches manifest version: $installed_version"
          fi
