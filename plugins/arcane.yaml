      files:
        - from: LICENSE
          to: .
        - from: kubectl-plugin-arcane
          to: .
      selector:
        matchLabels:
          os: darwin
          arch: amd64

    - bin: kubectl-plugin-arcane
      uri: https://github.com/SneaksAndData/kubectl-plugin-arcane/releases/download/v0.1.12/kubectl-plugin-arcane_0.1.12_darwin_arm64.tar.gz
      sha256: a3a0b3fee9fd17dad92bb5b0563e8731c23608d8a17af667e10eb58c4ff127bc
      files:
        - from: LICENSE
          to: .
        - from: kubectl-plugin-arcane
          to: .
      selector:
        matchLabels:
          os: darwin
          arch: arm64

    - bin: kubectl-plugin-arcane
      uri: https://github.com/SneaksAndData/kubectl-plugin-arcane/releases/download/v0.1.12/kubectl-plugin-arcane_0.1.12_linux_amd64.tar.gz
      sha256: 4dfdb200bc89677f88ac51a2dfc570cb2ed6d7c0dd40e38e2f9648e9ef7650f7
